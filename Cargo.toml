[package]
name = "topcoat-shop"
version = "0.1.0"
edition = "2024"

[dependencies]
topcoat = { version = "0.5.0", features = ["font-fontsource", "tailwind", "multipart"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
argon2 = "0.5.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[build-dependencies]
topcoat = { version = "0.5.0", default-features = false, features = ["tailwind"] }

# Image decoding and resizing are unusably slow unoptimised -- an admin
# upload took half a minute in dev mode. These packages alone get -O3 in
# debug builds; everything else keeps fast compiles.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
