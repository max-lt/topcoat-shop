name = "bernard-edge"
main = "build/worker/shim.mjs"
compatibility_date = "2026-08-01"

[build]
command = "worker-build --release --no-default-features --features edge"

[[d1_databases]]
binding = "DB"
database_name = "bernard-en"
database_id = "4e7473e4-baea-4aa3-8d8c-f5b418ab5d1b"

# One object per SKU, as PHOTOS_DIR holds one file per SKU.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "bernard-photos"

# Resize and webp at the edge: no image codec compiles into the wasm.
[images]
binding = "IMAGES"

# Written by `cargo run --bin static-bundle`. A request matching a file
# here never reaches the Worker.
[assets]
directory = "public"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
